[package]
name = "txguardian-registry"
version = "0.1.0"
description = "TxGuardian on-chain risk attestation registry"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "txguardian_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
